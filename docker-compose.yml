services:
  db:
    image: postgres:15-alpine
    container_name: neuroread-db
    restart: always
    environment:
      POSTGRES_USER: neuro_user
      POSTGRES_PASSWORD: neuro_password
      POSTGRES_DB: neuroread
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: neuroread-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neuro_user:neuro_password@db:5432/neuroread
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: neuroread-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: